<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ImageFlow</title>
    </head>
    <style>
        @import url('templates/style.css');
    </style>
    <body>
        <div class="frame">
            <h1>ImageFlow</h1>
            <h2>Обработка изображений</h2>

            <div class="container">
                <h3>Загрузить изображение</h3>
                <form action="/upload" method="post" enctype="multipart/form-data">
                    <input type="file" name="file" accept="image/*" required>
                    <select name="filter">
                        <option value="none">Без фильтра</option>
                        <option value="grayscale">Чёрно-белое</option>
                        <option value="blur">Размытие</option>
                        <option value="sharpen">Резкость</option>
                    </select>
                    <p></p>
                    <button type="submit">Загрузить</button>
                </form>
            </div>

            <div class="container">
                <h3>Мои изображения</h3>
                <div id="images">
                    <!-- Сюда будут подгружаться изображения -->
                </div>
            </div>
            <hr>
            <div class="refcontainer">
                <h3>Обработанные изображения</h3>
                <div id="reference">

                </div>
            </div>

            <div class="logout">
                <a href="/logout">Выйти</a>
            </div>
        </div>

        <script src="templates/scripts.js"></script>
        <script>
            loadImages()
            loadImagesRef()
        </script>
    </body>
</html>
