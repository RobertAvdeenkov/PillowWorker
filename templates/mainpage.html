<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ImageFlow</title>
    </head>
    <style>
        @import url('templates/style.css');
    </style>
    <body>
        <div class="frame">
            <h1>ImageFlow</h1>
            <h2>Обработка изображений</h2>

            <div class="container">
                <h3>Загрузить изображение</h3>
                <form action="/upload" method="post" enctype="multipart/form-data">
                    <input type="file" name="file" accept="image/*" required>
                    <select name="filter">
                        <option value="none">Без фильтра</option>
                        <option value="grayscale">Чёрно-белое</option>
                        <option value="blur">Размытие</option>
                        <option value="sharpen">Резкость</option>
                    </select>
                    <p></p>
                    <button type="submit">Загрузить</button>
                </form>
            </div>

            <div class="container">
                <h3>Мои изображения</h3>
                <div id="images">
                    <!-- Сюда будут подгружаться изображения -->
                </div>
            </div>
            <hr>
            <div class="refcontainer">
                <h3>Обработанные изображения</h3>
                <div id="reference">

                </div>
            </div>

            <div class="logout">
                <a href="/logout">Выйти</a>
            </div>
        </div>

        <script>

            async function fetchWithAuth(url, options = {}) {
                let response = await fetch(url, options);
                if (response.status === 401 || response.status ===422) {
                    const refreshResponse = await fetch('/refresh', { method: 'POST' });
                    console.log(refreshResponse.status)
                    if (refreshResponse.status!==401) {
                        response = await fetch(url, options); // повторяем запрос
                    } else {
                        window.location.href = '/'; // refresh тоже истёк
                    }
                }
                return response;
            }

            async function loadImages() {
                const response = await fetchWithAuth('/images');
                const data = await response.json();
                const container = document.getElementById('images');
                container.innerHTML = '';

                if (!data.images || data.images.length === 0) {
                    container.innerHTML = '<div class="empty">Изображений пока нет ¯\\_(ツ)_/¯</div>';
                    return;
                }

                data.images.forEach(image => {
                    const statusClass = `status-${image.status}`;
                    container.innerHTML += `
                        <div class="image-card">
                            <div class="image-info">
                                <h3>${image.filename}</h3>
                                <div class="status ${statusClass}">Статус: ${image.status}</div>
                                <div class="status">Загружено: ${image.created_at}</div>
                            </div>
                            <div class="actions">
                                <button onclick="deleteImage(${image.id})">Удалить</button>
                            </div>
                        </div>
                    `;
                });
            }


            async function loadImagesRef() {
                const response = await fetchWithAuth('/refimages');
                const data = await response.json();
                const container = document.getElementById('reference');
                container.innerHTML = '';

                if (!data.images || data.images.length === 0) {
                    container.innerHTML = '<div class="empty">Изображений пока нет ¯\\_(ツ)_/¯</div>';
                    return;
                }

                data.images.forEach(image => {
                    const statusClass = `status-${image.size}`;
                    container.innerHTML += `
                        <div class="image-card">
                            <div class="image-info">
                                <a href="/images/${image.filename}">${image.filename}</a>
                                <div class="status ${statusClass}">Размер: ${image.size}</div>
                            </div>
                            <div class="actions">
                                <button onclick="deleteReference(${image.id})">Удалить</button>
                            </div>
                        </div>
                    `;
                });
            }


            async function deleteImage(id) {
                if (!confirm('Удалить изображение?')) return;
                await fetchWithAuth(`/images/${id}`, { method: 'DELETE' });
                loadImages();
                loadImagesRef();
            }

            async function deleteReference(id) {
                if (!confirm('Удалить изображение?')) return;
                await fetchWithAuth(`/reference/${id}`, { method: 'DELETE' });
                loadImages();
                loadImagesRef();
            }

            // Загрузка при старте
            loadImages();
            loadImagesRef();
        </script>
    </body>
</html>
